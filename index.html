<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Goldfish Feed 🐠</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-color: #18181b; 
            --card-bg: #1f1f23;
            --text-main: #efeff1;
            --text-muted: #adadb8;
            --border-radius: 4px;
            
            --color-follow: #ff4f8d;
            --color-sub: #bf94ff;
            --color-giftsub: #a970ff;
            --color-cheer: #00dbdb;
            --color-donation: #00fa9a;
            --color-redeem: #f5da55;
            --color-raid: #ff544f;
            --color-poll: #00cefa;
            --color-hypetrain: #ffb300;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            font-size: 13px;
            user-select: none; 
        }

        #login-screen {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            position: absolute; top:0; left:0; right:0; bottom:0;
            background: var(--bg-color);
            z-index: 999;
        }
        .login-btn {
            background-color: #9147ff;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover { background-color: #772ce8; }
        .hidden { display: none !important; }
        .sl-btn {
            background-color: #31c3a2;
            font-size: 0.9rem; 
            padding: 8px 16px;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
        }
        .sl-btn:hover { background-color: #2ba88d; }
        .sl-btn:disabled { background-color: #2ea44f; cursor: default; opacity: 1; }

        #app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
        }
        
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            border: 2px solid #9147ff;
            display: none; 
        }
        
        .header-right { display: flex; align-items: center; gap: 15px; }

        .viewercount {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff544f; 
            font-weight: 700;
            font-size: 1.1rem;
            display: none; 
        }

        .viewercount.offline {
            color: var(--text-muted);
        }
        
        .app-title { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.02em; }
        .username-highlight { color: #9147ff; }

        .settings-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 1.2rem; transition: color 0.2s;
        }
        .settings-btn:hover { color: var(--text-main); }

        #controls {
            background: var(--card-bg); padding: 10px 15px;
            border-radius: var(--border-radius); margin-bottom: 20px; border: 1px solid #333;
        }

        .settings-section {
            margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #333;
        }
        .settings-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .reply-section {
            display: none; margin-top: 10px; gap: 8px; width: 100%;
        }
        .reply-section.open { display: flex; }
        
        .reply-input {
            flex: 1; background: #000; border: 1px solid #333; 
            color: #fff; padding: 8px; border-radius: 4px; font-size: 0.9rem;
        }
        .reply-input:focus { outline: 1px solid #9147ff; border-color: #9147ff; }
        
        .reply-send-btn {
            background: #9147ff; color: #fff; border: none; 
            padding: 0 16px; border-radius: 4px; cursor: pointer; font-weight: 700;
        }
        .reply-send-btn:hover { background: #772ce8; }
        .btn-reply-icon {
            position: relative; top: auto; right: auto; bottom: auto; width: auto; display: inline-flex;
            align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted);
            opacity: 0.8; border-radius: 4px; transition: all 0.2s; margin-left: 15px; padding: 6px 12px;
            font-size: 1rem;
            background-color: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top-right-radius: var(--border-radius);
            border-bottom-right-radius: var(--border-radius);
            z-index: 10;
        }

        .event-item:hover .btn-reply-icon { opacity: 1; }

        .btn-reply-icon:hover {
            color: #fff;
            background-color: #9147ff; 
        }

        .toggles-grid { display: flex; gap: 15px; flex-wrap: wrap; }
        .behavior-options { display: flex; gap: 20px; margin-bottom: 10px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-header { font-weight: 700; text-transform: uppercase; font-size: 0.75rem; margin-bottom: 2px; }

        label {
            display: flex; align-items: center; gap: 6px;
            cursor: pointer; color: var(--text-muted); font-size: 0.8rem;
        }
        
        input[type="checkbox"] { accent-color: #9147ff; cursor: pointer; }

        #feed { display: flex; flex-direction: column; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .event-item {
            display: flex; align-items: flex-start; padding: 10px;
            background-color: transparent; border-left: 4px solid transparent;
            cursor: pointer; position: relative; border-radius: var(--border-radius);
            
            /* Animation Base State */
            max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; overflow: hidden;
            transition: all 1.0s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .event-item.show {
            max-height: 150px; opacity: 1; padding: 10px; margin-bottom: 2px;
        }

        .icon-box { width: 20px; margin-right: 12px; display: flex; justify-content: center; font-size: 16px; margin-top: 1px; }
        .content { display: flex; flex-direction: column; flex: 1; line-height: 1.4; padding-right: 50px; }
        .username { font-weight: 700; color: var(--text-main); }
        .message { color: var(--text-muted); margin-top: 4px; font-style: italic; }
        .chat-message { margin-top: 4px; color: var(--text-main); opacity: 0.9; word-break: break-word; }
        .timestamp { color: var(--text-muted); font-size: 0.75rem; margin-left: 5px; }

        .event-item.follow { border-left-color: var(--color-follow); }
        .event-item.follow .icon-box { color: var(--color-follow); }
        
        .event-item.sub { border-left-color: var(--color-sub); }
        .event-item.sub .icon-box { color: var(--color-sub); }
        
        .event-item.giftsub { border-left-color: var(--color-giftsub); }
        .event-item.giftsub .icon-box { color: var(--color-giftsub); }
        
        .event-item.cheer { border-left-color: var(--color-cheer); }
        .event-item.cheer .icon-box { color: var(--color-cheer); }
        
        .event-item.redeem { border-left-color: var(--color-redeem); }
        .event-item.redeem .icon-box { color: var(--color-redeem); }
        
        .event-item.donation { border-left-color: var(--color-donation); }
        .event-item.donation .icon-box { color: var(--color-donation); }
        
        .event-item.raid { border-left-color: var(--color-raid); }
        .event-item.raid .icon-box { color: var(--color-raid); }
        
        .event-item.poll { border-left-color: var(--color-poll); }
        .event-item.poll .icon-box { color: var(--color-poll); }
        
        .event-item.hypetrain { border-left-color: var(--color-hypetrain); }
        .event-item.hypetrain .icon-box { color: var(--color-hypetrain); }
        
        .event-item.shoutout { border-left-color: var(--color-giftsub); }
        .event-item.shoutout .icon-box { color: var(--color-giftsub); }
        
        .event-item.announcement { border-left-color: var(--color-raid); }
        .event-item.announcement .icon-box { color: var(--color-raid); }
        
        .event-item.prediction { border-left-color: var(--color-poll); }
        .event-item.prediction .icon-box { color: var(--color-poll); }
        
        .event-item.whisper { border-left-color: var(--color-raid); }
        .event-item.whisper .icon-box { color: var(--color-raid); }


        .event-item.follow.active { background-color: var(--color-follow); }
        .event-item.sub.active { background-color: var(--color-sub); }
        .event-item.giftsub.active { background-color: var(--color-giftsub); }
        .event-item.cheer.active { background-color: var(--color-cheer); }
        .event-item.redeem.active { background-color: var(--color-redeem); }
        .event-item.donation.active { background-color: var(--color-donation); }
        .event-item.raid.active { background-color: var(--color-raid); }
        .event-item.poll.active { background-color: var(--color-poll); }
        .event-item.shoutout.active { background-color: var(--color-giftsub); }
        .event-item.announcement.active { background-color: var(--color-raid); }
        .event-item.prediction.active { background-color: var(--color-poll); }
        .event-item.whisper.active { background-color: var(--color-raid); }

        .event-item.active .username,
        .event-item.active .message,
        .event-item.active .chat-message,
        .event-item.active .timestamp,
        .event-item.active .action-text {
            color: #000 !important; opacity: 0.9;
        }
        .event-item.active .icon-box { color: #000 !important; }

        .event-item.acknowledged {
            background-color: transparent !important;
            opacity: 1; 
        }
        
        .event-item.acknowledged .username {
            color: #ececec !important; 
        }
        
        .event-item.acknowledged .message,
        .event-item.acknowledged .chat-message,
        .event-item.acknowledged .timestamp {
            color: #666 !important;
        }

        .hidden-force { display: none !important; }

        .uptime-box {
            display: flex; align-items: center; gap: 6px;
            color: var(--text-muted); font-weight: 600; font-size: 1.1rem;
            font-variant-numeric: tabular-nums;
            margin-right: 15px;
        }
        .uptime-box.hidden { display: none; }

        .timer-bg {
            position: absolute; top: 0; left: 0; bottom: 0;
            background-color: #ffb300;
            z-index: 0; width: 100%; pointer-events: none;
            transition: width linear;
        }

        .event-item.hypetrain.active {
            background-color: #1f1f23 !important;
        }

        .event-item.hypetrain.active .username,
        .event-item.hypetrain.active .message {
            color: #fff !important;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            position: relative;
            z-index: 2;
        }

        .event-item .content, 
        .event-item .icon-box, 
        .event-item .btn-reply-icon { 
            position: relative; 
            z-index: 2; 
        }
        a.username {
            text-decoration: none;
            color: var(--text-main);
        }
        a.username:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div id="login-screen">
        <button class="login-btn" onclick="authorize()">Connect with Twitch</button>
    </div>

    <div id="app-content" class="hidden">
        
        <div id="app-header">
            <div class="header-left">
                <img id="user-avatar" class="header-avatar" alt="Avatar">
                <div class="app-title">Goldfish Feed <span id="header-username" class="username-highlight">Live</span></div>
            </div>
            
            <div class="header-right">
                <div id="uptime-display" class="uptime-box hidden">
                    <i class="fa-regular fa-clock"></i>
                    <span id="uptime-clock">00:00:00</span>
                </div>
                <div id="viewercount" class="viewercount offline" title="Stream is Offline">
                    <i class="fa-solid fa-user-group"></i>
                    <span id="viewer-number">OFFLINE</span>
                </div>
                <button class="settings-btn" onclick="toggleSettings()"><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>

        <div id="controls" class="hidden">
        <div class="settings-section">
                <div class="control-header" style="color: #fff; margin-bottom: 8px;">Integrations</div>
                
                <div style="margin-bottom: 8px;">
                    <label style="margin-bottom: 4px; display: block;">Streamlabs Socket Token</label>
                    <input type="password" id="sl-token-input" placeholder="Paste token here..." 
                        style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box;"
                        onchange="saveStreamlabsToken(this.value)">
                </div>
                
                <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px;">
                    Found in <a href="https://streamlabs.com/dashboard#/settings/api-settings" target="_blank" style="color: #31c3a2;">Streamlabs API Settings</a> -> API Tokens -> "Your Socket API Token".
                </div>

                <div id="sl-status" style="font-size: 0.8rem; color: var(--text-muted);">
                    <i class="fa-solid fa-circle-xmark"></i> Not Connected
                </div>
            </div>
            <div class="settings-section">
                <div class="control-header" style="color: #fff; margin-bottom: 8px;">Appearance</div>
                <div class="behavior-options">
                    <label title="Hide the viewer count number from the header">
                        <input type="checkbox" id="opt-hide-viewers" onchange="toggleViewerCount(this.checked)"> Hide Viewer Count
                    </label>
                </div>
                <div style="margin-top: 8px; font-style: italic; color: var(--text-muted);">
                    Tip: Right-click an event to delete it instantly.
                </div>
            </div>

            <div class="settings-section">
                <div class="toggles-grid" id="toggles-container"></div>
            </div>
        </div>

        <div id="feed"></div>
    </div>

    <script>
        const CLIENT_ID = 'lt7p3t0i66py3xi742ekkpkw8d1xvk';
        const REDIRECT_URI = window.location.origin + window.location.pathname; 
        
        // State
        let accessToken = null;
        let userId = null;
        let socket = null;
        let sessionId = null;
        let currentHypeLevel = 0;
        let moderatorIds = new Set();
        let slAccessToken = null;
        let slSocketToken = null;
        let slSocket = null;
        let streamStartTime = null;
        
        // Session persistence logic
        function saveSession() {
            const items = [];
            document.querySelectorAll('.event-item').forEach(el => {
                if (el.dataset.raw) {
                    items.push({
                        data: JSON.parse(el.dataset.raw),
                        acknowledged: el.classList.contains('acknowledged'),
                        timestamp: el.querySelector('.timestamp').getAttribute('data-time')
                    });
                }
            });
            localStorage.setItem('feed_session', JSON.stringify(items.reverse()));
        }

        function restoreSession() {
            const saved = localStorage.getItem('feed_session');
            if (saved) {
                const items = JSON.parse(saved);
                items.forEach(item => {
                    addEventToFeed(item.data, item.acknowledged, item.timestamp);
                });
                localStorage.removeItem('feed_session');
            }
        }

        function handleTokenExpiry() {
            console.log("Token expired. Saving state and reloading...");
            saveSession();
            authorize(); 
        }

        // Authentication
        function authorize() {
            const scopes = 'chat:read+moderator:read:followers+channel:read:subscriptions+channel:read:redemptions+bits:read+channel:read:polls+channel:read:hype_train+user:read:chat+moderator:read:shoutouts+moderator:manage:shoutouts+channel:read:predictions+channel:read:goals+channel:read:ads+user:read:whispers+moderation:read+user:manage:whispers';
            const url = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=${scopes}`;
            window.location.href = url;
        }

        function checkAuth() {
            const hash = window.location.hash;
            
            // Handle Twitch Return
            if (hash.includes('access_token')) {
                const params = new URLSearchParams(hash.substring(1));
                accessToken = params.get('access_token');
                window.history.replaceState({}, document.title, window.location.pathname);

                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');

                init();
            } else if (localStorage.getItem('feed_session')) {
                authorize();
            }
        }

        async function fetchModerators() {
            if (!userId) return;
            try {
                const res = await fetch(`https://api.twitch.tv/helix/moderation/moderators?broadcaster_id=${userId}&first=100`, {
                    headers: { 'Authorization': `Bearer ${accessToken}`, 'Client-Id': CLIENT_ID }
                });
                const data = await res.json();
                if (data.data) {
                    data.data.forEach(mod => moderatorIds.add(mod.user_id));
                    console.log(`Loaded ${moderatorIds.size} moderators.`);
                }
            } catch (e) {
                console.error("Failed to fetch moderators:", e);
            }
        }

        async function init() {
            try {
                restoreSession();

                const userRes = await fetch('https://api.twitch.tv/helix/users', {
                    headers: { 'Authorization': `Bearer ${accessToken}`, 'Client-Id': CLIENT_ID }
                });
                
                if (userRes.status === 401) {
                    handleTokenExpiry();
                    return;
                }

                const userData = await userRes.json();
                const user = userData.data[0];
                userId = user.id;
                
                document.getElementById('header-username').innerText = "for " + user.display_name;
                if (user.profile_image_url) {
                    const img = document.getElementById('user-avatar');
                    img.src = user.profile_image_url;
                    img.style.display = 'block';
                }

                console.log(`Logged in as: ${user.display_name}`);
                await fetchModerators();
                
                connectTwitchWebSocket();
                initStreamlabs();
                
                fetchViewerCount();
                setInterval(fetchViewerCount, 60000);
                setInterval(updateRelativeTimes, 60000);
                setInterval(updateUptimeClock, 1000);

            } catch (e) {
                console.error("Login failed:", e);
                alert("Login failed. Check console.");
            }
        }

        function saveStreamlabsToken(token) {
            if (!token) return;
            localStorage.setItem('sl_socket_token', token);
            initStreamlabs();
        }

        function initStreamlabs() {
            const token = localStorage.getItem('sl_socket_token');
            const input = document.getElementById('sl-token-input');
            const status = document.getElementById('sl-status');

            if (token) {
                if (input) input.value = token; 
                connectStreamlabsSocket(token);
            }
        }

        function connectStreamlabsSocket(token) {
            if (slSocket) slSocket.disconnect();

            slSocket = io(`https://sockets.streamlabs.com?token=${token}`, {
                transports: ['websocket']
            });

            const status = document.getElementById('sl-status');

            slSocket.on('connect', () => {
                console.log("Streamlabs Connected");
                if (status) {
                    status.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #2ea44f;"></i> Connected';
                }
            });

            slSocket.on('connect_error', (err) => {
                console.error("SL Connect Error:", err);
                if (status) {
                    status.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color: #ff544f;"></i> Connection Failed (Check Token)';
                }
            });

            slSocket.on('event', (eventData) => {
                if (eventData.type === 'donation') {
                    eventData.message.forEach(item => {
                        const data = {
                            type: 'donation',
                            user: item.name,
                            message: `Donated ${item.formatted_amount}`,
                            chatMessage: item.message
                        };
                        addEventToFeed(data);
                    });
                }
            });
        }

        async function fetchViewerCount() {
            if (!userId) return;
            try {
                const res = await fetch(`https://api.twitch.tv/helix/streams?user_id=${userId}`, {
                    headers: { 'Authorization': `Bearer ${accessToken}`, 'Client-Id': CLIENT_ID }
                });

                if (res.status === 401) {
                    handleTokenExpiry();
                    return;
                }

                const data = await res.json();
                const viewEl = document.getElementById('viewercount');
                const numEl = document.getElementById('viewer-number');
                const uptimeEl = document.getElementById('uptime-display');

                if (data.data && data.data.length > 0) {
                    // Stream is LIVE
                    const streamData = data.data[0]
                    numEl.innerText = streamData.viewer_count;
                    viewEl.classList.remove('offline');
                    viewEl.title = "Live Viewers";
                    streamStartTime = new Date(streamData.started_at).getTime();
                    uptimeEl.classList.remove('hidden');
                } else {
                    // Stream is OFFLINE
                    numEl.innerText = "OFFLINE";
                    viewEl.classList.add('offline');
                    viewEl.title = "Stream is Offline";
                    streamStartTime = null;
                    uptimeEl.classList.add('hidden');
                }
                if (localStorage.getItem('hideViewers') === 'true') {
                    viewEl.classList.add('hidden-force');
                } else {
                    viewEl.classList.remove('hidden-force');
                }
                viewEl.style.display = 'flex'; // Ensure it's always visible
            } catch (e) {
                console.error("Viewer fetch failed", e);
            }
        }

        // Twitch WebSocket
        function connectTwitchWebSocket() {
            socket = new WebSocket('wss://eventsub.wss.twitch.tv/ws');

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.metadata.message_type === 'session_welcome') {
                    sessionId = data.payload.session.id;
                    subscribeToEvents(); 
                }
                else if (data.metadata.message_type === 'notification') {
                    handleNotification(data.payload);
                }
            };
        }

        // Subscriptions
        async function subscribeToEvents() {
            const subs = [
                { type: 'channel.follow', version: '2', condition: { broadcaster_user_id: userId, moderator_user_id: userId } },
                { type: 'channel.bits.use', version: '1', condition: { broadcaster_user_id: userId } },
                { type: 'channel.channel_points_custom_reward_redemption.add', version: '1', condition: { broadcaster_user_id: userId } },
                { type: 'channel.poll.begin', version: '1', condition: { broadcaster_user_id: userId } },
                { type: 'channel.poll.end', version: '1', condition: { broadcaster_user_id: userId } },
                { type: 'channel.hype_train.begin', version: '2', condition: { broadcaster_user_id: userId } },
                { type: 'channel.hype_train.progress', version: '2', condition: { broadcaster_user_id: userId } },
                { type: 'channel.hype_train.end', version: '2', condition: { broadcaster_user_id: userId } },
                { type: 'channel.shoutout.create', version: '1', condition: {broadcaster_user_id: userId, moderator_user_id: userId } },
                { type: 'channel.shoutout.receive', version: '1', condition: {broadcaster_user_id: userId, moderator_user_id: userId } },
                { type: 'channel.prediction.begin', version: '1', condition: { broadcaster_user_id: userId } },
                { type: 'channel.prediction.end', version: '1', condition: { broadcaster_user_id: userId } },
                { type: 'user.whisper.message', version: '1', condition: { user_id: userId } },
                { 
                    type: 'channel.chat.notification', 
                    version: '1', 
                    condition: { broadcaster_user_id: userId, user_id: userId } 
                }
            ];

            for (const sub of subs) {
                await fetch('https://api.twitch.tv/helix/eventsub/subscriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Client-Id': CLIENT_ID,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        type: sub.type,
                        version: sub.version,
                        condition: sub.condition,
                        transport: { method: 'websocket', session_id: sessionId }
                    })
                });
            }
            console.log("Subscriptions registered.");
        }

        // Handle events
        function handleNotification(payload) {
            const event = payload.event;
            const type = payload.subscription.type;
            let data = null;

            if (type === 'channel.chat.notification') {
                const noticeType = event.notice_type;
                const sub = event.sub;
                const resub = event.resub;
                const subGift = event.sub_gift;
                const communityGift = event.community_sub_gift;
                const raid = event.raid;
                const payForward = event.pay_it_forward;

                if (noticeType === 'sub') {
                    const plan = String(sub.sub_plan || sub.sub_tier);
                    const tier = plan === "Prime" ? "Prime" : (plan === "2000" ? "2" : (plan === "3000" ? "3" : "1"));
                    
                    const durationText = (sub.duration_months && sub.duration_months > 1) 
                        ? ` for ${sub.duration_months} Months` 
                        : '';

                    if (sub.is_prime || plan === "Prime") {
                         data = { type: 'sub', user: event.chatter_user_name, message: `Subscribed${durationText} with Prime` };
                    } else {
                         data = { type: 'sub', user: event.chatter_user_name, message: `Subscribed${durationText} (Tier ${tier})` };
                    }
                }
                else if (noticeType === 'resub') {
                    const plan = String(resub.sub_plan || resub.sub_tier);
                    const tier = plan === "Prime" ? "Prime" : (plan === "2000" ? "2" : (plan === "3000" ? "3" : "1"));
                    const months = resub.cumulative_months;
                    const streak = resub.streak_months;
                    
                    const streakText = streak ? ` [${streak} Month Streak]` : '';

                    let msgText = `Resubscribed for ${months} months (Tier ${tier})${streakText}`;
                    if (resub.is_prime || plan === "Prime") {
                        msgText = `Resubscribed for ${months} months with Prime${streakText}`;
                    }

                    data = {
                        type: 'sub',
                        user: event.chatter_user_name,
                        message: msgText,
                        chatMessage: event.message?.text
                    };
                }
                else if (noticeType === 'sub_gift') {
                    if (!subGift.community_gift_id) {
                         const plan = subGift.sub_plan;
                         const tier = plan === "2000" ? "2" : (plan === "3000" ? "3" : "1");
                         const recipient = subGift.recipient_user_name;
                         const gifter = event.chatter_is_anonymous ? "Anonymous Gifter" : event.chatter_user_name;
                         
                         const validGiftDurations = [3, 6, 12];
                         const durationText = validGiftDurations.includes(subGift.duration_months) 
                             ? ` ${subGift.duration_months}-Month` 
                             : '';

                         data = { type: 'giftsub', user: gifter, message: `Gifted a${durationText} Tier ${tier} Sub to ${recipient}` };
                    }
                }
                else if (noticeType === 'community_sub_gift') {
                    const count = communityGift.total;
                    const plan = communityGift.sub_plan;
                    const tier = plan === "2000" ? "2" : (plan === "3000" ? "3" : "1");
                    const gifter = event.chatter_is_anonymous ? "Anonymous Gifter" : event.chatter_user_name;
                    const cumulative = communityGift.cumulative_total;
                    
                    let msg = `Gifted ${count} Tier ${tier} Subs`;
                    if (cumulative && cumulative > 0) {
                        msg += ` (Total Given: ${cumulative})`;
                    }
                    
                    data = { type: 'giftsub', user: gifter, message: msg };
                }
                else if (noticeType === 'pay_it_forward') {
                    const originalGifter = payForward.gifter_is_anonymous ? "Anonymous" : payForward.gifter_user_name;
                    const recipient = payForward.recipient_user_name || "the community"; 
                    data = { 
                        type: 'giftsub', 
                        user: event.chatter_user_name, 
                        message: `Is Paying Forward a gift from ${originalGifter}!` 
                    };
                }
                else if (noticeType === 'prime_paid_upgrade') {
                    data = { 
                        type: 'sub', 
                        user: event.chatter_user_name, 
                        message: `Converted Prime Sub to Tier ${event.prime_paid_upgrade.sub_plan === '2000' ? '2' : (event.prime_paid_upgrade.sub_plan === '3000' ? '3' : '1')}` 
                    };
                }
                else if (noticeType === 'gift_paid_upgrade') {
                    const upgrade = event.gift_paid_upgrade;
                    const gifter = upgrade.gifter_is_anonymous ? "Anonymous" : upgrade.gifter_user_name;
                    data = { 
                        type: 'sub', 
                        user: event.chatter_user_name, 
                        message: `Continued the gift sub from ${gifter}!` 
                    };
                }
                else if (noticeType === 'raid') {
                    const viewerCount = raid.viewer_count;
                    data = { type: 'raid', user: event.chatter_user_name, userId: event.chatter_user_id,
                            message: `Raided with ${viewerCount} viewers` };
                }
                else if (noticeType === 'announcement') {
                    data = {
                    type: 'announcement',
                    user: event.chatter_user_name,
                    message: 'Announcement',
                    chatMessage: event.message.text
                    };
                }
            }

            else if (type === 'channel.follow') {
                data = { type: 'follow', user: event.user_name, message: 'Followed you' };
            }
            else if (type === 'channel.bits.use') {
                const user = event.user_name || 'Anonymous';
                let messageText = `Used ${event.bits} Bits`;
                
                if (event.power_up) {
                    messageText = `Used Power-up: ${event.power_up.name || 'Unknown'} (${event.bits} bits)`;
                } else {
                    messageText = `Cheered ${event.bits} bits`;
                }

                data = { 
                    type: 'cheer', 
                    user: user, 
                    message: messageText, 
                    chatMessage: event.message ? event.message.text : '' 
                };
            }
            else if (type === 'channel.channel_points_custom_reward_redemption.add') {
                data = { 
                    type: 'redeem', 
                    user: event.user_name, 
                    message: `Redeemed ${event.reward.title}`,
                    chatMessage: event.user_input
                };
            }
            else if (type === 'channel.poll.begin') {
                data = { type: 'poll', user: 'Poll Started', message: event.title };
            }
            else if (type === 'channel.poll.end') {
                const maxVotes = Math.max(...event.choices.map(c => c.votes));
                const winners = event.choices.filter(c => c.votes === maxVotes);
                const winnerText = winners.map(w => w.title).join(" & "); // e.g. "Pizza & Burgers"
                const message = `Winner: ${winnerText} (${maxVotes} votes)`;

                const existingPoll = document.querySelector('.event-item.poll.active');
                
                if (existingPoll) {
                    existingPoll.querySelector('.username').innerText = 'Poll Ended';
                    existingPoll.querySelector('.message').innerText = message;
                    
                    existingPoll.classList.remove('active');
                    existingPoll.classList.add('acknowledged');
                    
                    const raw = JSON.parse(existingPoll.dataset.raw);
                    raw.message = message;
                    raw.user = 'Poll Ended';
                    existingPoll.dataset.raw = JSON.stringify(raw);
                    
                    saveSession();
                } else {
                    data = { type: 'poll', user: 'Poll Ended', message: message };
                }
            }
            else if (type === 'channel.hype_train.begin') {
                currentHypeLevel = 1;
                const percent = Math.round((event.progress / event.goal) * 100) || 0;
                data = { 
                    type: 'hypetrain', 
                    user: 'Hype Train', 
                    message: `Level 1 • ${percent}%`, 
                    expiresAt: event.expires_at 
                };
            }
            else if (type === 'channel.hype_train.progress') {
                const percent = Math.round((event.progress / event.goal) * 100) || 0;
                
                if (event.level > currentHypeLevel) {
                    currentHypeLevel = event.level;
                    data = {
                        type: 'hypetrain',
                        user: 'Hype Train',
                        message: `Level ${event.level} • ${percent}%`,
                        expiresAt: event.expires_at
                    };
                } else {
                    const existing = document.querySelector('.event-item.hypetrain.active');
                    if (existing) {
                        existing.querySelector('.message').innerText = `Level ${event.level} • ${percent}%`;
                        const raw = JSON.parse(existing.dataset.raw);
                        raw.message = `Level ${event.level} • ${percent}%`;
                        existing.dataset.raw = JSON.stringify(raw);
                        saveSession();
                    }
                }
            }
            else if (type === 'channel.hype_train.end') {
                currentHypeLevel = 0; 
                data = { type: 'hypetrain', user: 'Hype Train', message: `Ended at Level ${event.level}` };
            }

            else if (type === 'channel.shoutout.create') {
                data = { 
                    type: 'shoutout', 
                    user: event.to_broadcaster_user_name, 
                    message: `You gave a Shoutout!` 
                };
            }
            else if (type === 'channel.shoutout.receive') {
                data = { 
                    type: 'shoutout', 
                    user: event.from_broadcaster_user_name, 
                    message: `Gave you a Shoutout to (${event.viewer_count} viewers)` 
                };
            }
            else if (type === 'channel.prediction.begin') {
                data = { type: 'prediction', user: 'Prediction Started', message: event.title };
            }
            else if (type === 'channel.prediction.end') {
                const winningId = event.winning_outcome_id;
                const winner = event.outcomes.find(o => o.id === winningId);
                const title = winner ? winner.title : 'N/A';
                const points = winner ? winner.channel_points : 0;
                
                data = { type: 'prediction', user: 'Prediction Ended', message: `Winner: ${title} (${points} pts)` };
            }
            else if (type === 'user.whisper.message') {
                if (moderatorIds.has(event.from_user_id)) {
                    data = {
                        type: 'whisper',
                        user: `${event.from_user_name} (Mod)`,
                        userId: event.from_user_id,
                        message: event.whisper.text
                    };
                }
            }
            if (data) addEventToFeed(data);
        }

        // Relative time logic
        function getRelativeTime(timestamp) {
            const now = new Date();
            const then = new Date(parseInt(timestamp));
            const diffInSeconds = Math.floor((now - then) / 1000);

            if (diffInSeconds < 60) return 'Just now';
            const minutes = Math.floor(diffInSeconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            return `${hours}h ago`;
        }

        function updateRelativeTimes() {
            const timestamps = document.querySelectorAll('.timestamp');
            timestamps.forEach(el => {
                const rawTime = el.getAttribute('data-time');
                if (rawTime) {
                    el.innerText = getRelativeTime(rawTime);
                }
            });
        }

        function updateUptimeClock() {
            if (!streamStartTime) return;

            const now = Date.now();
            const diff = now - streamStartTime;
            const seconds = Math.floor((diff / 1000) % 60);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const hours = Math.floor((diff / (1000 * 60 * 60)));

            const pad = (n) => n.toString().padStart(2, '0');
            
            document.getElementById('uptime-clock').innerText = 
                `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        // UI Logic
        const feed = document.getElementById('feed');
        const togglesContainer = document.getElementById('toggles-container');
        const controls = document.getElementById('controls');
        
        function toggleSettings() { controls.classList.toggle('hidden'); }
        function savePref(key, val) { localStorage.setItem(key, val); }
        
        function toggleViewerCount(checked) {
            const el = document.getElementById('viewercount');
            if (checked) {
                el.classList.add('hidden-force');
            } else {
                el.classList.remove('hidden-force');
            }
            savePref('hideViewers', checked);
        }
        
        // Reply Logic
        function toggleReply(e, iconBtn) {
            e.stopPropagation(); // Prevent card acknowledgment
            const wrapper = iconBtn.closest('.content');
            const replyBox = wrapper.querySelector('.reply-section');
            replyBox.classList.toggle('open');
            if (replyBox.classList.contains('open')) {
                replyBox.querySelector('input').focus();
            }
        }

        function handleReplyKey(e, targetId, inputEl) {
            if (e.key === 'Enter') {
                const btn = inputEl.nextElementSibling;
                sendReply(targetId, btn);
            }
        }

        async function sendReply(targetId, btnEl) {
            const input = btnEl.previousElementSibling;
            const text = input.value.trim();
            if (!text) return;

            btnEl.innerText = '...';

            try {
                const res = await fetch(`https://api.twitch.tv/helix/whispers?from_user_id=${userId}&to_user_id=${targetId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Client-Id': CLIENT_ID,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                if (res.status === 204) {
                    input.value = '';
                    const section = btnEl.parentElement;
                    section.classList.remove('open');

                    const card = btnEl.closest('.event-item');
                    if (card) {
                        card.classList.remove('active');
                        card.classList.add('acknowledged');
                        saveSession();
                    }

                    btnEl.innerText = 'Send';
                } else {
                    throw new Error('Failed');
                }
            } catch (e) {
                console.error(e);
                btnEl.innerText = 'Error';
                btnEl.style.background = '#ff544f';
            }
        }

        async function sendShoutout(e, targetId, btnEl) {
            e.stopPropagation(); // Stop the card from clicking itself
            
            btnEl.className = 'fa-solid fa-circle-notch fa-spin btn-reply-icon';

            try {
                // Twitch API: Send Shoutout
                const res = await fetch(`https://api.twitch.tv/helix/chat/shoutouts?from_broadcaster_id=${userId}&to_broadcaster_id=${targetId}&moderator_id=${userId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Client-Id': CLIENT_ID,
                        'Content-Type': 'application/json'
                    }
                });

                if (res.status === 204) {
                    // Success! Turn icon green/check
                    btnEl.className = 'fa-solid fa-check btn-reply-icon';
                    btnEl.style.color = '#00fa9a';

                    // Auto-Complete the Card (Grey it out)
                    const card = btnEl.closest('.event-item');
                    if (card) {
                        card.classList.remove('active');
                        card.classList.add('acknowledged');
                        saveSession();
                    }
                } else {
                    throw new Error('Failed');
                }
            } catch (err) {
                console.error(err);
                btnEl.className = 'fa-solid fa-triangle-exclamation btn-reply-icon';
                btnEl.style.color = '#ff544f';
            }
        }

        // Setup UI
        const settings = {};
        const types = ['follow', 'sub', 'giftsub', 'cheer', 'redeem', 'raid', 'poll', 'hypetrain', 'announcement', 'shoutout', 'prediction', 'goal', 'adbreak', 'whisper', 'donation'];
        
        const icons = { 
            follow: 'fa-solid fa-heart', 
            sub: 'fa-solid fa-star', 
            giftsub: 'fa-solid fa-gift', 
            cheer: 'fa-solid fa-gem', 
            redeem: 'fa-solid fa-ticket', 
            raid: 'fa-solid fa-parachute-box',
            poll: 'fa-solid fa-square-poll-vertical',
            hypetrain: 'fa-solid fa-train',
            announcement: 'fa-solid fa-triangle-exclamation',
            shoutout: 'fa-solid fa-bullhorn',
            prediction: 'fa-solid fa-chart-pie',
            whisper: 'fa-solid fa-comment-dots',
            donation: 'fa-solid fa-money-bill-wave'
        };
        
        const colors = { 
            follow: '#ff4f8d', 
            sub: '#bf94ff', 
            giftsub: '#a970ff', 
            cheer: '#00dbdb', 
            redeem: '#f5da55', 
            raid: '#ff544f',
            poll: '#00cefa',
            hypetrain: '#ffb300',
            announcement: '#ff544f',
            shoutout: '#a970ff',
            prediction: '#00cefa',
            whisper: '#ff544f',
            donation: '#00fa9a'
        };

        types.forEach(type => {
            settings[type] = { show: true, highlight: true };
            const group = document.createElement('div');
            group.className = 'control-group';
            group.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2px;">
                    <div class="control-header" style="color: ${colors[type]}">${type}</div>
                    <button class="test-btn" onclick="testFire('${type}')" title="Test Fire" style="background:none; border:none; color:#666; cursor:pointer; font-size:0.8rem; padding:0 4px;">
                        <i class="fa-solid fa-flask"></i>
                    </button>
                </div>
                <label><input type="checkbox" checked onchange="toggle('${type}', 'show', this.checked)"> Show</label>
                <label><input type="checkbox" checked onchange="toggle('${type}', 'highlight', this.checked)"> Highlight</label>
            `;
            togglesContainer.appendChild(group);
        });

        function toggle(t, s, v) { settings[t][s] = v; }

        function testFire(type) {
            const randomUser = 'User_' + Math.floor(Math.random() * 999);
            
            let mockData = {
                type: type,
                user: randomUser,
                message: 'Test Event triggered',
                timestamp: Date.now()
            };

            switch(type) {
                case 'follow':
                    mockData.message = 'Followed you';
                    break;

                case 'sub':
                    mockData.message = 'Resubscribed for 3 months (Tier 1) [+6 Months in Advance] [3 Month Streak]';
                    mockData.chatMessage = 'Love the stream! peepoFaff';
                    break;

                case 'giftsub':
                    mockData.user = 'GoldfishGifter';
                    mockData.message = `Gifted a 3-Month Tier 1 Sub to ${randomUser}`;
                    break;

                case 'cheer':
                    mockData.message = 'Cheered 500 bits';
                    mockData.chatMessage = '!sr Goldfish and Smoke';
                    break;

                case 'redeem':
                    mockData.message = 'Redeemed "Hydrate"';
                    mockData.chatMessage = 'mmm delicious H2O';
                    break;

                case 'raid':
                    mockData.user = 'asmongoldfish';
                    mockData.userId = '123'; 
                    mockData.message = 'Raided with 421 viewers';
                    break;

                case 'poll':
                    mockData.user = 'Poll Started';
                    mockData.message = 'Open or closed sandwiches?';
                    break;

                case 'hypetrain':
                    mockData.user = 'Hype Train';
                    mockData.message = 'Level 3 • 65%';
                    mockData.expiresAt = Date.now() + 300000; 
                    break;

                case 'announcement':
                    mockData.user = 'some_random_mod';
                    mockData.message = 'Announcement';
                    mockData.chatMessage = 'Pre-order Roswell Road\'s new album \'Rebel Joy\' here: https://roswellroadmusic.bandcamp.com/album/rebel-joy';
                    break;

                case 'shoutout':
                    mockData.user = 'Shoutta05';
                    mockData.message = 'Gave you a Shoutout to (42 viewers)';
                    break;

                case 'prediction':
                    mockData.user = 'Prediction Started';
                    mockData.message = 'Will streamer yawn during this hype train?';
                    break;

                case 'whisper':
                    mockData.user = 'some_random_mod';
                    mockData.userId = '123'; 
                    mockData.message = 'Last call before we close song requests?';
                    break;

                case 'donation':
                    mockData.user = 'GenerousViewer';
                    mockData.message = 'Donated $25.00';
                    mockData.chatMessage = 'Keep up the good work!';
                    break;
                
                case 'goal':
                    mockData.user = 'Follow Goal';
                    mockData.message = 'Goal Reached: 1000 Followers!';
                    break;

                case 'adbreak':
                    mockData.user = 'Ad Break';
                    mockData.message = 'Running a 90s Ad Break';
                    break;
            }

            addEventToFeed(mockData);
        }

        function addEventToFeed(data, forceAck = false, forceTime = null) {
            if (!settings[data.type].show) return;

            const el = document.createElement('div');
            el.dataset.raw = JSON.stringify(data);

            const initialState = forceAck
                ? 'acknowledged'
                : (settings[data.type].highlight ? 'active' : 'acknowledged');

            el.className = `event-item ${data.type} ${initialState}`;

            const now = forceTime ? parseInt(forceTime) : Date.now();
            const relTime = getRelativeTime(now);

            let timerHtml = '';
            if (data.type === 'hypetrain' && data.expiresAt && !forceAck) {
                timerHtml = `<div class="timer-bg" style="width: 100%"></div>`;
            }

            const systemEvents = ['poll', 'hypetrain', 'prediction', 'goal', 'adbreak'];
            const isSystem = systemEvents.includes(data.type);

            const urlUser = data.user.replace(' (Mod)', '');

            const userHtml = isSystem
                ? `<span class="username">${data.user}</span>`
                : `<a href="https://twitch.tv/${urlUser}" target="_blank" class="username" onclick="event.stopPropagation()">${data.user}</a>`;

            let html = `
                ${timerHtml}
                <div class="icon-box"><i class="${icons[data.type]}"></i></div>
                
                <div class="content">
                    <div style="display:flex; align-items:center; width: 100%; flex-wrap: wrap;">
                        ${userHtml}
                        <span class="timestamp" data-time="${now}">${relTime}</span>
                        
                        ${data.type === 'whisper' ? `<i class="fa-solid fa-reply btn-reply-icon" title="Reply" onclick="toggleReply(event, this)"></i>` : ''}
                        ${data.type === 'raid' ? `<i class="fa-solid fa-bullhorn btn-reply-icon" title="Shoutout" onclick="sendShoutout(event, '${data.userId}', this)"></i>` : ''}
                    </div>
                    <div class="message">${data.message}</div>
            `;

            if (data.chatMessage) {
                html += `<div class="chat-message">"${data.chatMessage}"</div>`;
            }

            if (data.type === 'whisper' && data.userId) {
                html += `
                    <div class="reply-section" onclick="event.stopPropagation()">
                        <input type="text" class="reply-input" placeholder="Type reply..." onkeydown="handleReplyKey(event, '${data.userId}', this)">
                        <button class="reply-send-btn" onclick="sendReply('${data.userId}', this)">Send</button>
                    </div>
                `;
            }

            html += `</div>`;
            el.innerHTML = html;

            el.onclick = (e) => {
                if (e.target.closest('.delete-btn')) return;
                if (e.target.closest('.reply-section')) return;
                if (e.target.tagName === 'A') return;
                
                if (el.classList.contains('active')) {
                    el.classList.remove('active');
                    el.classList.add('acknowledged');
                } else {
                    el.classList.remove('acknowledged');
                    el.classList.add('active');
                }
                saveSession();
            };

            el.oncontextmenu = (e) => {
                e.preventDefault();
                el.remove();
                saveSession();
            };

            feed.prepend(el);

            if (data.type === 'hypetrain' && data.expiresAt && !forceAck) {
                const duration = new Date(data.expiresAt).getTime() - Date.now();
                const timerBar = el.querySelector('.timer-bg');

                if (duration > 0 && timerBar) {
                    setTimeout(() => {
                        if (!el.isConnected) return;
                        timerBar.style.transition = `width ${duration}ms linear`;
                        timerBar.style.width = '0%';
                    }, 500);

                    setTimeout(() => {
                        if (el.isConnected && el.classList.contains('active')) {
                            el.classList.remove('active');
                            el.classList.add('acknowledged');
                            saveSession();
                        }
                    }, duration);
                }
            }

            void el.offsetWidth;
            el.classList.add('show');

            if (!forceTime) saveSession();
        }

        if (localStorage.getItem('hideViewers') === 'true') {
            document.getElementById('opt-hide-viewers').checked = true;
            toggleViewerCount(true);
        }

        checkAuth();
    </script>
